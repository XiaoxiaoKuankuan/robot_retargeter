# 手部仍保留为 G1 式低权重接触任务，但绝不能参与地板高度估计。这里使用源
# skeleton 的 canonical contact 名称，而不是 BUMI3 MJCF body 名称。
ground_reference_contacts:
- left_foot_end
- left_toe
- right_foot_end
- right_toe
# 与 G1 一致，不使用显式 contact_map：按 contact_links/contact_names 的固定顺序
# 建立四个足点和两个手点的传统低权重接触任务。接触区间 mean 锁点和摆动期
# 零残差保持沿用 G1 语义；高度检测与动态偏移只读取四足点。
contact_pos_fixed_factor: 15.0
contact_task_mode: legacy_hold
contact_position_aggregation: mean
contact_transition_window_seconds: 0.0
contact_weight_ramp_seconds: 0.0
paired_flat_orientation_cost: 0.0
# 平足接触期仅软约束同一只脚 heel_z-toe_z=0。它不锁足点 XY、不指定绝对 z，
# 且 Root-Z 在相对高度雅可比中相消；cost 15 仍低于腿部位置任务 30，0.10 秒
# smootherstep 避免目标代价硬开关。
heel_toe_height_difference_cost: 15.0
heel_toe_height_difference_ramp_seconds: 0.10
# 保持仓库/G1 默认的逐帧接触高度偏移，但输入严格裁剪为上面的四个足点，手部
# 即使被检测为接触也不会参与整机 Z。初始值不再取全序列 1% 最低高度，而是先
# 按速度筛稳定足点，再选最低的最大密集高度簇并以中位数拟合水平 z 地板。
contact_height_dynamic_offset_enabled: true
contact_height_prevent_penetration: false
contact_height_relative_to_sequence_floor: true
contact_height_floor_method: stable_support_dense_median
contact_height_floor_fit_speed_threshold_mps: 0.2
contact_height_floor_fit_inlier_tolerance_m: 0.04
contact_height_floor_fit_min_samples: 8
contact_hysteresis:
  enabled: false
  enter_speed_mps: 0.2
  exit_speed_mps: 0.35
  enter_relative_height_m: 0.075
  exit_relative_height_m: 0.1
  enter_confirmation_seconds: 0.06
  exit_confirmation_seconds: 0.08
  minimum_contact_seconds: 0.2
  minimum_swing_seconds: 0.2
require_ground_contact_detection: false
post_ik_ground_bodies: []
post_ik_ground_clearance: 0.003
post_ik_ground_mode: lift_only
post_ik_foot_floor_barrier:
  # G1 式连续性优先模式不做接触前竖直预约束或事后单踝修正；后者会改变足点
  # 圆弧方向并制造新的 jerk。脚滑、悬空和穿地仍由报告与 warning 如实记录，
  # 但不再把它们误表述为 legacy_hold 能够保证的硬合同。
  enabled: false
