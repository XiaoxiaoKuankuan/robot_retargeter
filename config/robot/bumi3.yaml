robot_xml_path: asset/robot/bumi3/mjcf/bumi3_retarget.xml
# 当前生产配置以 G1 的 30 Hz、IK 任务权重、低权重 legacy_hold、停止准则及
# 无后处理策略为基线。BUMI3 必需的模型、坐标标定、初始姿态和真实关节限位
# 保持独立。地板与逐帧动态高度偏移只读取四个足点，手部接触不会驱动整机 Z；
# 初始地板由低速稳定足点的最低密集高度簇稳健拟合，不再使用整段 1% 分位。
# 用于运动学对照；交付 IsaacLab/控制器前仍需显式重采样到其 50 Hz 更新周期。
verbose: true
render_debug: false
keypoints_path: output_data/keypoints/bumi3/example_keypoints.pkl
ik_mode: single_stage
max_ik_iterations: 50
initial_settle_iterations: 50
ik_error_improvement_threshold: 0.001
ik_error_metric: legacy_raw
ik_solver: daqp
ik_damping: 1.0
temporal_posture_cost: 0.0
max_output_joint_velocity_rad_s: 0.0
max_output_joint_acceleration_rad_s2: 0.0
max_output_joint_jerk_rad_s3: 0.0
# 贴限位占比仍作为诊断 warning；实际越限与轨迹离散速度、加速度和 jerk 仍由
# 验证器硬验收。这里关闭输出修正，是为了与 G1 一样观察原始逐帧 IK 结果。
joint_limit_occupancy_validation: warning
postprocess_joint_gaussian_sigma_frames: 0.0
postprocess_support_projection: false
postprocess_min_active_support_height_m: -0.009
postprocess_max_stable_support_height_above_clearance_m: 0.018
knee_angle_offset_degrees: 15.0
joints_limit_offset_degrees:
