# 只是把播放器绑定到用户指定 GMR 仓库中的目标模型。若 GMR 仓库移动位置，需
# 同步更新此绝对路径，并重新运行对比整理脚本验证模型哈希和 qpos 合同。
robot_xml_path: /home/weili/GMR_minimal_robots_smplx.tar.gz/GMR-master/assets/bumi3/bumi3.xml
