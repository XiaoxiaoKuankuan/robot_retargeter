# 本配置只用于播放“原始 GMR legacy 流程”生成的 BUMI3 轨迹。GMR 资产与当前
# robot_retargeter 的 BUMI3 资产虽然关节名称相同，但 qpos 排列和 XML SHA256
# 不同，因此必须让播放器加载 GMR 自己的 XML，不能把 GMR CSV 交给 bumi3.yaml。
